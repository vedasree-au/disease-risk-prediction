login.html
========================================================= -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login
    </title>

    <!-- =====================================================
    CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- =====================================================
    GOOGLE FONT
    ====================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>

<body>

    <!-- =====================================================
    LOGIN CONTAINER
    ====================================================== -->

    <div class="auth-container">

        <div class="auth-card">

            <!-- =================================================
            TITLE
            ================================================== -->

            <h2>
                🔐 Login
            </h2>

            <p class="auth-subtitle">
                Welcome Back
            </p>

            <!-- =================================================
            EMAIL
            ================================================== -->

            <input
                type="email"
                id="login-email"
                placeholder="Enter Email"
            >

            <!-- =================================================
            PASSWORD
            ================================================== -->

            <input
                type="password"
                id="login-password"
                placeholder="Enter Password"
            >

            <!-- =================================================
            LOGIN BUTTON
            ================================================== -->

            <button onclick="loginUser()">

                Login

            </button>

            <!-- =================================================
            REGISTER LINK
            ================================================== -->

            <p class="auth-text">

                Don't have an account?

                <a href="register.html">

                    Register

                </a>

            </p>

            <!-- =================================================
            RESULT BOX
            ================================================== -->

            <div
                class="auth-result"
                id="login-result"
            ></div>

        </div>

    </div>

    <!-- =====================================================
    JAVASCRIPT
    ====================================================== -->

    <script src="auth.js"></script>

</body>

</html>
