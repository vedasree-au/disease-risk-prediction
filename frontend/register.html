FINAL COMPLETE REGISTER PAGE
========================================================= -->

<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
    META TAGS
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- =====================================================
    TITLE
    ====================================================== -->

    <title>
        Register
    </title>

    <!-- =====================================================
    GOOGLE FONT
    ====================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- =====================================================
    CSS FILE
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- =====================================================
    AUTH CONTAINER
    ====================================================== -->

    <div class="auth-container">

        <!-- =================================================
        AUTH CARD
        ================================================== -->

        <div class="auth-card">

            <!-- =============================================
            TITLE
            ============================================== -->

            <h2>
                📝 Register
            </h2>

            <!-- =============================================
            SUBTITLE
            ============================================== -->

            <p class="auth-subtitle">

                Create Your Account

            </p>

            <!-- =============================================
            USERNAME INPUT
            ============================================== -->

            <input
                type="text"
                id="register-username"
                placeholder="Enter Username"
            >

            <!-- =============================================
            EMAIL INPUT
            ============================================== -->

            <input
                type="email"
                id="register-email"
                placeholder="Enter Email"
            >

            <!-- =============================================
            PASSWORD INPUT
            ============================================== -->

            <input
                type="password"
                id="register-password"
                placeholder="Enter Password"
            >

            <!-- =============================================
            REGISTER BUTTON
            ============================================== -->

            <button onclick="registerUser()">

                Register

            </button>

            <!-- =============================================
            LOGIN LINK
            ============================================== -->

            <p class="auth-text">

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </p>

            <!-- =============================================
            RESULT BOX
            ============================================== -->

            <div
                class="auth-result"
                id="register-result"
            ></div>

        </div>

    </div>

    <!-- =====================================================
    JAVASCRIPT
    ====================================================== -->

    <script src="auth.js"></script>

</body>

</html>
